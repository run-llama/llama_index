[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "torch",
    "ipython==8.10.0",
    "jupyter>=1.0.0,<2",
    "mypy==0.991",
    "pre-commit==3.2.0",
    "pylint==4.0.9",
    "pytest",
    "pytest-mock==3.11.1",
    "ruff==0.11.11",
    "types-Deprecated>=0.1.0",
    "types-PyYAML>=6.0.12.12,<7",
    "types-protobuf>=4.24.0.4,<5",
    "types-redis==4.5.5.0",
    "types-requests==2.28.11.8",
    "types-setuptools==67.1.0.0",
    "black[jupyter]>=23.7.0,<=26.10.1",
    "codespell[toml]>=v2.2.6",
    "diff-cover>=9.2.0",
    "pytest-cov>=6.1.1",
]

[project]
name = "llama-index-extractors-entity"
version = "0.6.0"
description = "llama-index extractors entity integration"
authors = [{name = "Your Name", email = "you@example.com"}]
requires-python = ">=3.11,<4.0"
readme = "README.md"
license = "MIT"
dependencies = [
    "span-marker>=1.5.0",
    "huggingface-hub>=0.23.0",
    "llama-index-core>=0.13.0,<0.15",
]

[tool.codespell]
check-filenames = true
check-hidden = true
skip = "*.csv,*.html,*.json,*.jsonl,*.pdf,*.txt,*.ipynb"

[tool.hatch.build.targets.sdist]
include = ["llama_index/"]
exclude = ["**/BUILD"]

[tool.hatch.build.targets.wheel]
include = ["llama_index/"]
exclude = ["**/BUILD"]

[tool.llamahub]
contains_example = false
import_path = "llama_index.extractors.entity"

[tool.llamahub.class_authors]
EntityExtractor = "llama-index"

[tool.mypy]
disallow_untyped_defs = true
exclude = ["_static", "build", "examples", "notebooks", "venv"]
ignore_missing_imports = true
python_version = "3.8"

[tool.uv]
# Lock-only override. span-marker 1.6+ (latest 1.8.1) requires transformers<5,
# and every transformers 4.x release is inside HIGH advisories that are only
# patched in 5.x. span-marker 1.5.0, the last release without that cap, doesn't
# import under transformers 5. With this override, the lock pairs span-marker
# 1.8.1 with patched transformers. That imports, which is all the unit test
# checks, but SpanMarker inference does NOT run on transformers 5: its custom
# attention masks don't fit transformers 5's masking code. Installs from PyPI
# ignore this setting and follow span-marker's own transformers<5 cap.
override-dependencies = ["transformers>=5.10.0"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# CPU-only test env: keep the multi-GB CUDA stack out of the lock
torch = {index = "pytorch-cpu"}
