[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "mypy",
    "ruff",
]

[project]
name = "llama-index-tools-seowebchecker"
version = "0.1.0"
description = "llama-index tools seowebchecker integration"
authors = [{name = "SEOWebChecker", email = "support@seowebchecker.com"}]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = "MIT"
maintainers = [{name = "jaiganesh6999"}]
keywords = [
    "seo",
    "audit",
    "meta",
    "core-web-vitals",
    "seowebchecker",
]
dependencies = [
    "llama-index-core>=0.10.0,<0.15",
    "seowebchecker-seoaudit-sdk>=1.0.0",
]

[tool.codespell]
check-filenames = true
check-hidden = true
skip = "*.csv,*.html,*.json,*.jsonl,*.pdf,*.txt,*.ipynb"

[tool.hatch.build.targets.sdist]
include = ["llama_index/"]
exclude = ["**/BUILD"]

[tool.hatch.build.targets.wheel]
include = ["llama_index/"]
exclude = ["**/BUILD"]

[tool.llamahub]
contains_example = false
import_path = "llama_index.tools.seowebchecker"

[tool.llamahub.class_authors]
SEOWebCheckerToolSpec = "jaiganesh6999"

[tool.mypy]
disallow_untyped_defs = true
exclude = ["_static", "build", "examples", "notebooks", "venv"]
ignore_missing_imports = true
python_version = "3.10"
