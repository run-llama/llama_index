[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov>=6.1.1",
    "pytest-asyncio",
    "pre-commit",
]

[project]
name = "llama-index-tools-zambo"
version = "0.1.0"
description = "Zambo tools for LlamaIndex: 153 tools behind one MCP endpoint (https://zambo.dev/mcp), a verifiable AER-1 receipt for every job, and HANDOVER continuity across AIs."
authors = [{name = "zambodotdev"}]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = "Apache-2.0"
maintainers = []
dependencies = [
    "llama-index-core>=0.13.0,<0.15",
]
keywords = ["llama-index", "llamahub", "zambo", "aer-1", "mcp", "ai-agents", "verifiable-receipt", "handover", "agent-continuity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://zambo.dev"
"AER-1 standard" = "https://zambo.dev/aer1/"
"IETF Draft" = "https://datatracker.ietf.org/doc/draft-zambo-aer1/26/"

[tool.hatch.build.targets.sdist]
include = ["llama_index/"]
exclude = ["**/BUILD"]

[tool.hatch.build.targets.wheel]
include = ["llama_index/"]
exclude = ["**/BUILD"]

[tool.llamahub]
contains_example = true
import_path = "llama_index.tools.zambo"

[tool.llamahub.class_authors]
ZamboToolSpec = "zambodotdev"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --ignore=examples"
asyncio_mode = "auto"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
