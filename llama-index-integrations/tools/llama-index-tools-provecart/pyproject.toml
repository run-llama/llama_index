[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-index-tools-provecart"
version = "0.1.0"
description = "ProveCart pre-payment verification tools for LlamaIndex"
readme = "llama_index/tools/provecart/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["llama-index-core>=0.11"]

[tool.setuptools.packages.find]
include = ["llama_index*"]
namespaces = true
