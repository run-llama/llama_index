name: Unit Testing

on:
  pull_request:

env:
  # How many concurrent processes running pytest in a single CI job
  NUM_WORKERS: 8

jobs:
  test:
    runs-on: ubuntu-latest-unit-tester
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run tests
        shell: bash
        working-directory: llama-dev
        run: |
          git fetch origin ${GITHUB_EVENT_PULL_REQUEST_BASE_REF}:${GITHUB_EVENT_PULL_REQUEST_BASE_REF}
          uv run -- llama-dev \
            --repo-root ".." ${{ runner.debug && '--debug' || '' }} test \
            --workers ${{ env.NUM_WORKERS }} \
            --base-ref ${GITHUB_EVENT_PULL_REQUEST_BASE_REF} \
            --clean
        env:
          GITHUB_EVENT_PULL_REQUEST_BASE_REF: ${{ github.event.pull_request.base.ref }}

  test-core-py314:
    runs-on: ubuntu-latest-unit-tester
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Run tests for llama-index-core
        shell: bash
        working-directory: llama-dev
        run: |
          git fetch origin ${GITHUB_EVENT_PULL_REQUEST_BASE_REF}:${GITHUB_EVENT_PULL_REQUEST_BASE_REF}
          uv run -- llama-dev \
            --repo-root ".." ${{ runner.debug && '--debug' || '' }} test \
            --workers ${{ env.NUM_WORKERS }} \
            --cov \
            llama-index-core
        env:
          GITHUB_EVENT_PULL_REQUEST_BASE_REF: ${{ github.event.pull_request.base.ref }}
