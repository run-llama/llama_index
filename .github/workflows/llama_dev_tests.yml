name: llama-dev tests

on:
  push:
    branches:
      - main
    paths:
      - "llama-dev/**"
  pull_request:
    paths:
      - "llama-dev/**"

jobs:
  test-llama-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Set up Python
        run: uv python install

      - name: Run tests
        working-directory: llama-dev
        run: uv run pytest --cov llama_dev --cov-report term-missing
